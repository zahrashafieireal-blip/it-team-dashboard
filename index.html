.task-overview-filters{display:grid;grid-template-columns:1fr;gap:8px;margin:8px 0 12px}.overview-filter{border:1px solid #dfe8e5;background:#f7faf9;border-radius:14px;padding:11px 12px;text-align:right;display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:inherit;color:#21433a;font-size:13px;cursor:pointer;transition:.15s}.overview-filter .radio{width:18px;height:18px;border:2px solid #aabbb5;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:0 0 18px}.overview-filter .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:#13785f;transform:scale(0);transition:.15s}.overview-filter.active{background:#e8f4f0;border-color:#13785f;box-shadow:0 0 0 1px #13785f inset}.overview-filter.active .radio{border-color:#13785f}.overview-filter.active .radio::after{transform:scale(1)}.overview-filter .filter-label{display:flex;align-items:center;gap:8px;flex:1}.overview-filter b{min-width:28px;text-align:center;border-radius:10px;background:#e5efec;padding:4px 6px}.overview-filter.active b{background:#13785f;color:#fff}.task-overview-list{display:flex;flex-direction:column;gap:7px}.overview-task-row{width:100%;border:1px solid #e4ebe9;background:#fff;border-radius:13px;padding:10px;text-align:right;font-family:inherit;color:#1e332e;cursor:pointer}.overview-task-row span,.overview-task-row strong,.overview-task-row small{display:block}.overview-task-row span{font-size:12px;color:#60736d;margin-bottom:4px}.overview-task-row strong{font-size:13px;line-height:1.7}.overview-task-row small{font-size:11px;color:#70807b;margin-top:4px}}

  <body class="login-active">
<div class="app">
<header><h1>داشبورد عملکرد تیم فناوری اطلاعات</h1></header>
<main>
<section id="login" class="panel active">
<div class="login-modern-wrap">
  <div class="login-modern-card">
    <div class="login-modern-logo"><img src="app-icon-512.png" alt="لوگوی برنامه"></div>
    <div class="login-modern-brand">
      <h2>داشبورد مدیریت عملکرد تیم فناوری اطلاعات</h2>
      <p></p>
      <div class="login-modern-line"></div>
    </div>
    <div class="login-modern-field">
      <select id="userSelect" aria-label="انتخاب کاربر"></select>
    </div>
    <div class="login-modern-field login-password-wrap">
      <input id="loginPassword" type="password" autocomplete="current-password" placeholder="رمز عبور" aria-label="رمز عبور">
      <button type="button" class="login-eye" aria-label="نمایش رمز عبور" onclick="toggleLoginPassword()">◉</button>
    </div>
    <button class="login-modern-btn" type="button" onclick="enterApp()">ورود به سامانه</button>
    <script>document.addEventListener('keydown',function(e){if(e.key==='Enter'&&document.getElementById('login')?.classList.contains('active'))enterApp()});</script>
  </div>
</div>
</section>

<section id="home" class="panel">
<div class="userbox profile-dashboard-card">
  <div class="profile-actions">
    <button class="home-register-btn profile-main-action" type="button" onclick="showPanel('add');prepareActivityOwner()"><span class="plus">＋</span><span>ثبت تسک جدید</span></button>
  </div>
  <div class="profile-divider"></div>
  <div class="profile-identity">
    <div class="profile-text">
      <h2 id="welcome">کارتابل</h2>
      <div id="currentUserRole" class="profile-role">کاربر</div>
    </div>
    <div id="currentUserAvatar" class="profile-avatar" aria-hidden="true"></div>
  </div>
</div>
<div id="managementBox" class="management-box">
  <div class="attention-title">📋 نمای کلی تسک‌های گروه</div>
  <div class="small" style="margin:6px 0 10px">یک یا چند مورد را انتخاب کنید تا لیست مربوط به آنها نمایش داده شود.</div>
  <div id="taskOverviewFilters" class="task-overview-filters"></div>
  <div id="taskOverviewList" class="task-overview-list"></div>
</div>
<div class="quick-actions">
  <button class="quick-btn" onclick="showTaskView('overdue')">⏰ ددلاین گذشته</button>
  <button class="quick-btn" onclick="showTaskView('current')">🔄 تسک‌های جاری</button>
  <button class="quick-btn" onclick="showTaskView('reviewed')">⭐ ارزیابی‌شده</button>
</div>
<div class="cardgrid">
<button class="card" onclick="showPanel('today');renderToday()"><div class="ico">📋</div><h3>فعالیت‌های امروز</h3></button>
<button class="card" onclick="showPanel('reports');initReports()"><div class="ico">📊</div><h3>گزارش‌گیری</h3></button>
<button class="card" onclick="showPanel('team');renderTeam()"><div class="ico">👥</div><h3>اعضای گروه</h3></button>
<button class="card" onclick="showPanel('meetings');renderMeetings()"><div class="ico">🏛️</div><h3>نوبت هیئت عمومی</h3></button>
<button class="card" onclick="showPanel('archive');renderArchive()"><div class="ico">🗂️</div><h3>آرشیو فعالیت‌ها</h3></button>
<button class="card" onclick="showPanel('reviews');renderReviews()"><div class="ico">📋✓</div><h3>ارزیابی و تایید تسک توسط مدیر</h3></button>
<button class="card" onclick="showPanel('settings');renderSettings()"><div class="ico">⚙️</div><h3>تنظیمات</h3></button>
</div>
</section>

<section id="groupTasks" class="panel">
<div class="topline"><h2 id="taskViewTitle">📋 تسک‌های گروه</h2><button class="back" onclick="showPanel('home')">↩️ بازگشت</button></div>
<div id="groupTaskStats" class="badges"></div>
<div id="groupTaskCards" class="mobile-task-list"></div>
<div class="tablewrap desktop-task-table"><table><thead><tr><th>تاریخ</th><th>مسئول</th><th>شرح تسک</th><th>وضعیت</th><th>ارزیابی مدیر</th><th>عملیات</th></tr></thead><tbody id="groupTaskBody"></tbody></table></div>
</section>

<section id="add" class="panel">
<div class="topline"><h2 id="activityFormTitle">➕ ثبت تسک جدید</h2><button class="back" onclick="showPanel('home')">↩️ بازگشت</button></div>
<label>تاریخ</label><div class="actions" style="margin:0"><input id="aDate" placeholder="۱۴۰۵/۰۵/۱۲"><button class="secondary" type="button" onclick="openCalendar('aDate')">📅 تقویم</button></div>
<label>کارشناس</label><select id="aOwner"></select>
<label>نوع فعالیت</label><select id="aType"><option>تسک</option><option>نامه</option><option>پشتیبانی</option><option>جلسه</option><option>پیگیری</option><option>پروژه</option><option>سخت‌افزار</option><option>سایر</option></select>
<label>شرح فعالیت</label><textarea id="aDesc"></textarea>
<label>وضعیت</label><select id="aStatus"><option>انجام شد</option><option>در حال انجام</option><option>منتظر پاسخ</option><option>لغو شد</option></select>
<label>مکاتبه</label><select id="aCorr"><option>خیر</option><option>بله</option></select>
<div id="letterFields" class="conditional-fields hidden"><label>شماره نامه</label><input id="aLetter">
<label>تاریخ نامه</label><input id="aLetterDate" placeholder="۱۴۰۵/۰۵/۱۲"></div>
<label>واحد</label><input id="aUnit">
<div id="deadlineFields"><label>Deadline</label><div class="actions" style="margin:0"><input id="aDeadline" placeholder="۱۴۰۵/۰۵/۲۰" inputmode="numeric"><button class="secondary" type="button" onclick="openCalendar('aDeadline')">📅 تقویم فارسی</button></div></div>
<label>یادداشت</label><textarea id="aNotes"></textarea>
<div class="actions"><button id="activitySaveBtn" class="primary" onclick="saveActivity()">💾 ثبت فعالیت</button><button id="activityCancelEditBtn" class="danger hidden" onclick="cancelEditActivity()">لغو ویرایش</button><button class="secondary" onclick="clearActivityForm()">پاک کردن</button></div>
</section>

<section id="today" class="panel"><div class="topline"><h2>📋 فعالیت‌های امروز</h2><button class="back" onclick="showPanel('home')">↩️ بازگشت</button></div><div id="todayContent"></div></section>

<section id="reports" class="panel">
<div class="topline"><h2>📊 گزارش‌گیری</h2><button class="back" onclick="showPanel('home')">↩️ بازگشت</button></div>
<div class="userbox" style="margin-top:12px">

    </select></div>
  </div>
  <div id="reportDateControls"></div>
  <div class="filter-row" style="margin-top:8px">

  </div>

    <div style="flex:1"><label>ارزیابی مدیر</label><select id="reportReview"><option value="">همه موارد</option><option value="reviewed">ارزیابی‌شده</option><option value="pending">در انتظار بررسی</option></select></div>

  if(p[0]>=1200&&p[0]<=1600&&validDate(s)){
    const g=j2g(p[0],p[1],p[2]);
    return g[0]+'-'+pad(g[1])+'-'+pad(g[2]);
  }
  if(p[0]>=1900&&p[0]<=2200&&p[1]>=1&&p[1]<=12&&p[2]>=1&&p[2]<=31){
    return p[0]+'-'+pad(p[1])+'-'+pad(p[2]);
  }
  return '';
}
function jDaysInMonth(y,m){
  if(m<=6)return 31;
  if(m<=11)return 30;
  const g1=j2g(y,12,1), g2=j2g(y+1,1,1);
  const a=new Date(g1[0],g1[1]-1,g1[2]);
  const b=new Date(g2[0],g2[1]-1,g2[2]);
  return Math.round((b-a)/86400000)===366?30:29;
}
function validDate(s){
  const raw=enDigits(s).trim().replace(/-/g,'/');
  const p=raw.split('/').map(Number);
  if(p.length!==3||!p.every(Number.isInteger))return false;
  const [y,m,d]=p;
  if(y<1200||y>1600||m<1||m>12)return false;
  return d>=1&&d<=jDaysInMonth(y,m);
}

function renderCalendar(){
  const title=document.getElementById('calTitle'), days=document.getElementById('calDays');
  if(!title||!days)return;
  title.textContent=faDigits(calY)+' '+jmonths[calM-1];
  const g=j2g(calY,calM,1);
  const firstDow=new Date(g[0],g[1]-1,g[2]).getDay();
  const offset=(firstDow+1)%7;
  const count=jDaysInMonth(calY,calM);
  let html='';
  for(let i=0;i<offset;i++)html+='<span class="emptyday"></span>';
  const input=document.getElementById(calTarget);
  const selected=validDate(input?.value||'')?enDigits(input.value).replace(/-/g,'/').split('/').map(Number):[];
  for(let d=1;d<=count;d++){

    html+='<button type="button" class="calday'+active+'" onclick="selectCalDay('+calY+','+calM+','+d+')">'+faDigits(d)+'</button>';
  }

}

function reportDateRange(){
  const t=document.getElementById('reportType')?.value||'daily';
  if(t==='daily'){
    const v=document.getElementById('reportDate')?.value?.trim()||''; if(!validDate(v))return null;
    const g=jstrToG(v); return [normalizeStoredDate(g),normalizeStoredDate(g)];
  }
  if(t==='monthly'){
    const p=enDigits(document.getElementById('reportMonth')?.value||'').split('/').map(Number); if(p.length!==2||!p.every(Number.isFinite))return null;
    const a=j2g(p[0],p[1],1), n=p[1]===12?j2g(p[0]+1,1,1):j2g(p[0],p[1]+1,1), last=new Date(n[0],n[1]-1,n[2]-1);
    return [a[0]+'-'+pad(a[1])+'-'+pad(a[2]),last.getFullYear()+'-'+pad(last.getMonth()+1)+'-'+pad(last.getDate())];
  }
  const s=document.getElementById('reportStart')?.value?.trim()||'',e=document.getElementById('reportEnd')?.value?.trim()||'';
  if(!validDate(s)||!validDate(e))return null;
  const a=jstrToG(s),b=jstrToG(e); return [normalizeStoredDate(a),normalizeStoredDate(b)];
}
function getReportRows(){
  let arr=ownerData();
  const range=reportDateRange();
  if(!range)return {arr:null,range:null,error:'تاریخ گزارش را کامل و صحیح انتخاب کنید.'};
  if(range[0]>range[1])return {arr:null,range,error:'تاریخ شروع نمی‌تواند بعد از تاریخ پایان باشد.'};
  arr=arr.filter(x=>{const d=normalizeStoredDate(x.date);return d>=range[0]&&d<=range[1]});
  const person=document.getElementById('reportPerson')?.value||'';
  const typ=document.getElementById('reportActivityType')?.value||'';
  const st=document.getElementById('reportStatus')?.value||'';
  const rev=document.getElementById('reportReview')?.value||'';
  const q=(document.getElementById('reportSearch')?.value||'').trim().toLowerCase();
  if(person)arr=arr.filter(x=>x.owner===person);
  if(typ)arr=arr.filter(x=>x.type===typ);
  if(st)arr=arr.filter(x=>x.status===st);
  if(rev==='reviewed')arr=arr.filter(x=>x.managerApproval&&x.managerApproval!=='در انتظار بررسی');
  if(rev==='pending')arr=arr.filter(x=>!x.managerApproval||x.managerApproval==='در انتظار بررسی');
  if(q)arr=arr.filter(x=>(x.desc||'').toLowerCase().includes(q)||(x.letter||'').toLowerCase().includes(q));
  return {arr,range};
}

function normalizeOwnerName(v){return String(v??'').trim().replace(/^آقای\s+/,'').replace(/^خانم\s+/,'');}
function findActivityIndex(ref){
  const wanted=String(ref??'').trim();
  if(wanted){const byId=data.findIndex(t=>String(t?.id??'').trim()===wanted);if(byId!==-1)return byId;}
  const n=Number(ref);
  if(Number.isInteger(n) && n>=0 && n<data.length)return n;
  return -1;
}
function getActivityForRef(ref){const i=findActivityIndex(ref);return i>=0?data[i]:null;}

function deleteActivity(ref){
  const index=findActivityIndex(ref);
  if(index<0){alert('تسک موردنظر پیدا نشد.');return false;}
  return deleteActivityRecord(data,index);
}
function deleteActivityRecord(latest,index){
  if(!Array.isArray(latest) || index<0 || index>=latest.length){alert('تسک موردنظر پیدا نشد.');return false;}
  const item=latest[index];
  const user=normalizeOwnerName(currentUser);
  const owner=normalizeOwnerName(item?.owner);
  if(currentUser!=='مدیر' && owner!==user){alert('شما فقط می‌توانید تسک‌های خودتان را حذف کنید.');return false;}
  const details=['شرح: '+String(item?.desc||'—'),'مسئول: '+String(item?.owner||'—'),'تاریخ: '+String(item?.date||'—'),'نوع: '+String(item?.type||'تسک'),'وضعیت: '+String(item?.status||'—'),item?.deadline?'ددلاین: '+String(item.deadline):''].filter(Boolean).join('\n');
  if(!window.confirm('تأیید مشخصات تسک\n\n'+details+'\n\nآیا از حذف این تسک مطمئن هستید؟'))return false;
  latest.splice(index,1);
  data=latest;
  try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){alert('ذخیره حذف تسک انجام نشد.');return false;}
  if(typeof renderArchive==='function')renderArchive();
  if(typeof renderToday==='function')renderToday();
  if(typeof renderHome==='function')renderHome();
  if(typeof renderReviews==='function')renderReviews();
  closeDetail();
  alert('تسک با موفقیت حذف شد.');
  return true;
}

function restore(file){
  if(!file)return;
  let r=new FileReader();
  r.onload=()=>{
    try{
      let x=JSON.parse(r.result);
      if(!Array.isArray(x.data)||!Array.isArray(x.team)||!Array.isArray(x.meetings))throw 0;
      data=x.data.map(a=>Object.assign({managerApproval:'در انتظار بررسی',managerScore:'',managerComment:'',reviewedAt:''},a));
      team=x.team.map(m=>Object.assign({},m,{password:m.password||'1'}));
      meetings=x.meetings;
      if(typeof x.managerPassword==='string'&&x.managerPassword)managerPassword=x.managerPassword;
      localStorage.setItem(SEEDEDKEY,'1');
      save();fillSelectors();populateMonthSelect();renderSettings();renderHome();alert('بازیابی با موفقیت انجام شد.');
    }catch(e){alert('فایل پشتیبان معتبر نیست.')}
  };
  r.readAsText(file);
}
