name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          adb version

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f manifest.json ]; then
            cp manifest.json www/manifest.json
          fi

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core@7.4.5 @capacitor/android@7.4.5
          npm install -g @capacitor/cli@7.4.5

      - name: Check Capacitor CLI
        run: cap --version

      - name: Create Android project
        run: cap add android

      - name: Sync Capacitor
        run: cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: it-team-dashboard-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
